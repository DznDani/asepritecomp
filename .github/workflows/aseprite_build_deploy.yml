name: Build Aseprite (Windows)

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 12 * * *' # Comprueba actualizaciones automáticamente cada día al mediodía UTC
  workflow_dispatch: # Permite ejecutar la compilación con un botón manualmente

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.decision.outputs.build }}
    steps:
      - name: Consultar última versión de Aseprite
        id: version
        run: |
          TAG=$(curl -sL https://api.github.com/repos/aseprite/aseprite/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Última versión detectada: $TAG"

      - name: Comprobar historial de compilación
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build_status.txt
          key: aseprite-windows-${{ steps.version.outputs.tag }}

      - name: Decidir si es necesario compilar
        id: decision
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
              echo "build=true" >> $GITHUB_OUTPUT
          else
              echo "build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: windows-latest
    
    steps:
      - name: Descargar código fuente de Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.check-version.outputs.tag }}
          path: aseprite_src
          submodules: 'recursive'

      - name: Configurar entorno C++ (MSVC)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar compilador Ninja
        run: choco install ninja -y

      - name: Descargar dependencias de renderizado (Skia m102)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip" -OutFile "skia.zip"
          Expand-Archive -Path skia.zip -DestinationPath skia

      - name: Configurar entorno de construcción CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path aseprite_src\build
          cd aseprite_src\build
          cmake -DCMAKE_BUILD_TYPE=Release -DMAKE_CXX_FLAGS="/MP" -G Ninja -DLAF_BACKEND=skia -DSKIA_DIR="$env:GITHUB_WORKSPACE\skia" -DSKIA_LIBRARY_DIR="$env:GITHUB_WORKSPACE\skia\out\Release-x64" -DSKIA_LIBRARY="$env:GITHUB_WORKSPACE\skia\out\Release-x64\skia.lib" ..

      - name: Compilar binarios de Aseprite
        shell: pwsh
        run: |
          cd aseprite_src\build
          ninja aseprite

      - name: Preparar archivos ejecutables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path aseprite-portable
          Copy-Item -Path aseprite_src\build\bin\aseprite.exe -Destination aseprite-portable\
          Copy-Item -Path aseprite_src\build\bin\data -Destination aseprite-portable\data -Recurse

      - name: Empaquetar y subir ZIP privado
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ needs.check-version.outputs.tag }}-Windows
          path: aseprite-portable
          retention-days: 90

      - name: Registrar compilación exitosa
        if: success()
        shell: pwsh
        run: Set-Content -Path build_status.txt -Value "Completado"

      - name: Guardar historial en caché
        if: success()
        uses: actions/cache/save@v4
        with:
          path: build_status.txt
          key: aseprite-windows-${{ needs.check-version.outputs.tag }}
